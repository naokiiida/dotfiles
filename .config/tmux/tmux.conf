# ~/.config/tmux/tmux.conf
# tmux 3.6a configuration

# =============================================================================
# General Settings
# =============================================================================

# プレフィックスキーを Ctrl+a に変更 (Ctrl+b より押しやすい)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# True color + undercurl サポート (Ghostty)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # undercurl color

# マウスサポート有効化
set -g mouse on

# ウィンドウとペインのインデックスを1から開始
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウを閉じた時に番号を詰める
set -g renumber-windows on

# ヒストリサイズ
set -g history-limit 50000

# エスケープキーの遅延を削除 (vim用)
set -sg escape-time 0

# フォーカスイベントを有効化
set -g focus-events on

# OSC 52 パススルー許可 (SSH越しクリップボード用)
set -g allow-passthrough on
set -s set-clipboard on

# =============================================================================
# Key Bindings
# =============================================================================

# 設定ファイルのリロード
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ペイン分割 (現在のディレクトリを維持)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ペイン間移動 (vim風)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+矢印でペイン移動 (プレフィックス不要)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ペインリサイズ
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ウィンドウ切り替え
bind -n S-Left previous-window
bind -n S-Right next-window

# コピーモードでvi風キーバインド
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# =============================================================================
# Status Bar
# =============================================================================

set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=colour235,fg=colour255"

# 左側: セッション名
set -g status-left-length 30
set -g status-left "#[bg=colour39,fg=colour232,bold] #S #[bg=colour235] "

# 右側: 日時
set -g status-right-length 50
set -g status-right "#[fg=colour250] %Y-%m-%d #[fg=colour39,bold]%H:%M:%S "

# ウィンドウタブのスタイル
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour39,fg=colour232,bold] #I:#W "

# =============================================================================
# Session Persistence (manual approach)
# =============================================================================
# セッション保存/復元はプラグインなしでも可能ですが、
# tmux-resurrect プラグインの使用を推奨します

# =============================================================================
# Clipboard Integration
# =============================================================================

# OSC 52 でSSH越しにローカルクリップボードへコピー
set -g set-clipboard on

# macOS: pbcopy も併用、Linux: set-clipboard on だけで OSC 52 が効く
if-shell "uname | grep -q Darwin" {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
  bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
}

# =============================================================================
# Session Management
# =============================================================================

# セッション切り替え
bind s choose-tree -sZ

# 最後のセッションに切り替え
bind S switch-client -l

# 新しいセッションを作成
bind N new-session

# =============================================================================
# SSH-specific settings
# =============================================================================

# 新しいウィンドウ/ペインを作成時に環境変数を更新
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY"

# リモートtmux内のネストされたtmux用: F12でローカル/リモートのプレフィックスを切り替え
bind -T root F12  \
  set prefix None \;\
  set key-table off \;\
  set status-style "bg=colour238,fg=colour245" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S
