#theme = material_deep_ocean
#theme = "catppuccin_latte"
theme = "catppuccin_mocha"
# theme = "dracula"


[editor]
# mouse = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[keys.normal]
Cmd-s = ":write"

[keys.normal."space"]
# Lazygit
i = [
    ":write-all",
    ":new",
    ":insert-output lazygit",
    ":buffer-close!",
    ":redraw",
    ":reload-all"
]

[keys.insert]
"A-x" = "normal_mode"     # Maps Alt-X to enter normal mode
j = { k = "normal_mode" } # Maps `jk` to exit insert mode
