#helix doesn't handle .clang-format or other external style specifications, so they only matter if you're using an external formatter that looks for them
#https://github.com/helix-editor/helix/issues/4556

# [language-server.clangd]
# command = 'clangd'
# args = ['--function-arg-placeholders', '--completion-style=detailed', '--clang-tidy', '--log=verbose']
# [[language]]
# name = 'c'
# #formatter = { command = 'clang-format', args = ['--style=/home/niida/Documents/.clang-format'] }
# formatter = { command = 'clang-format', args = ['--style=file'] }
# auto-format = true
# language-servers = ['clangd', 'typos']

#https://github.com/helix-editor/helix/issues/9562

[[language]]
name = 'c'
#formatter = { command = 'clang-format', args = ['--style=/home/niida/Documents/.clang-format'] }
formatter = { command = 'c_formatter_42' }
auto-format = false
[language-server.clangd.config]
    fallbackFlags = [ "--std=c99" ]

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = ["tsconfig.json", "tsconfig.*.json"]
url = "https://json.schemastore.org/tsconfig.json"

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = [ "package.json" ]
url = "https://json.schemastore.org/package.json"

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = ["appsscript.json"]
url = "https://json.schemastore.org/appsscript"

[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = [ ".clasp.json" ]
url = "https://json.schemastore.org/clasp"

[language-server]
biome = { command = "biome", args = ["lsp-proxy"] }

[[language]]
name = "javascript"
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome" ]
auto-format = false

[[language]]
name = "typescript"
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome" ]
auto-format = true

[[language]]
name = "tsx"
auto-format = true
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome" ]

[[language]]
name = "jsx"
auto-format = true
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome" ]

[[language]]
name = "json"
language-servers = [ { name = "vscode-json-language-server", except-features = [ "format" ] }, "biome" ]
